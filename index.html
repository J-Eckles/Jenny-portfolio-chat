<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat with Jenny</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sand: #f0e8df;
    --warm-white: #faf7f3;
    --rust: #b84a1e;
    --rust-light: #d4603a;
    --rust-muted: #e8c4b3;
    --brown: #3d2b1f;
    --brown-mid: #6b4c3b;
    --brown-light: #a07060;
    --border: #e0d3c8;
    --card-shadow: 0 8px 40px rgba(61,43,31,0.13), 0 2px 8px rgba(61,43,31,0.07);
  }

  html, body {
    min-height: 100%;
    width: 100%;
    background: #ffffff;
    font-family: 'Poppins', sans-serif;
    color: var(--brown);
  }

  /* ── Page layout: card centered ── */
  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* ── Card ── */
  .card {
    width: 420px;
    height: 620px;
    background: var(--warm-white);
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.9);
    animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Header ── */
  .card-header {
    padding: 20px 22px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--warm-white);
    flex-shrink: 0;
    position: relative;
  }



  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rust-muted), var(--rust));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    color: white;
    font-weight: 500;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(184,74,30,0.3);
  }

  .header-text { flex: 1; }

  .header-text h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--brown);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }

  .header-text p {
    font-size: 11.5px;
    color: var(--brown-light);
    font-weight: 300;
    margin-top: 2px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--brown-light);
    flex-shrink: 0;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7eb87e;
    box-shadow: 0 0 0 2.5px rgba(126,184,126,0.22);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2.5px rgba(126,184,126,0.22); }
    50%       { box-shadow: 0 0 0 4px rgba(126,184,126,0.12); }
  }

  /* ── Chat area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    background: #ffffff;
  }

  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Messages ── */
  .msg {
    display: flex;
    gap: 8px;
    max-width: 88%;
    animation: msgIn 0.22s ease both;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }

  .msg-avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    margin-top: 2px;
  }

  .msg.bot  .msg-avatar { background: linear-gradient(135deg, var(--rust-muted), var(--rust)); color: white; }
  .msg.user .msg-avatar { background: var(--border); color: var(--brown-mid); }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.65;
    font-weight: 300;
  }

  .msg.bot .bubble {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    color: var(--brown);
    box-shadow: 0 1px 4px rgba(61,43,31,0.05);
  }

  .msg.user .bubble {
    background: var(--rust);
    color: white;
    border-bottom-right-radius: 3px;
    box-shadow: 0 2px 8px rgba(184,74,30,0.25);
  }

  /* Typing */
  .typing-bubble {
    background: var(--warm-white);
    border: 1px solid var(--border);
    padding: 12px 15px;
    border-radius: 14px;
    border-bottom-left-radius: 3px;
    display: flex;
    gap: 4px;
    align-items: center;
    box-shadow: 0 1px 4px rgba(61,43,31,0.05);
  }

  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--rust-muted);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40%           { transform: translateY(-4px); opacity: 1; }
  }

  /* Chips */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 2px 0 0 34px;
  }

  .chip {
    background: transparent;
    border: 1px solid var(--rust-muted);
    color: var(--rust);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 400;
    white-space: nowrap;
  }

  .chip:hover { background: var(--rust); color: white; border-color: var(--rust); }

  /* ── Footer / Input ── */
  .card-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: var(--warm-white);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--sand);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-row:focus-within {
    border-color: var(--rust-muted);
    box-shadow: 0 0 0 3px rgba(232,196,179,0.25);
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight: 300;
    color: var(--brown);
    resize: none;
    max-height: 80px;
    line-height: 1.5;
  }

  #user-input::placeholder { color: var(--brown-light); }

  #send-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--rust);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 2px 6px rgba(184,74,30,0.3);
  }

  #send-btn:hover { background: var(--rust-light); box-shadow: 0 3px 10px rgba(184,74,30,0.35); }
  #send-btn:active { transform: scale(0.91); }
  #send-btn:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; }
  #send-btn svg { width: 14px; height: 14px; fill: white; }

  .powered {
    text-align: center;
    font-size: 10.5px;
    color: var(--brown-light);
    margin-top: 8px;
    opacity: 0.55;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="page">
  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <div class="avatar">J</div>
      <div class="header-text">
        <h1>Jenny Eckles</h1>
        <p>Senior Product Designer</p>
      </div>

    </div>

    <!-- Messages -->
    <div class="chat-area" id="chat-area"></div>

    <!-- Input -->
    <div class="card-footer">
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="Ask about Jenny's work…"></textarea>
        <button id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <p class="powered">Powered by Claude</p>
    </div>

  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are a helpful, warm assistant representing Jenny Eckles's design portfolio. Answer questions about Jenny's work, experience, and background based on the information below. Be conversational, friendly, and concise. Keep responses to 2-4 sentences unless more detail is asked for. If you don't know something, say so honestly and suggest they reach out to Jenny directly at jenny.eckles97@gmail.com.

--- ABOUT JENNY ---
Jenny Eckles is a Senior Product Designer specializing in Smart Home & Operational Workflow. She has 5+ years of experience designing complex, multi-surface smart home systems at scale. She's known for turning high-stakes systems into simple, intuitive workflows.

Personal bio: "I'm a product designer who turns complex, high-stakes systems into simple, intuitive workflows. I think every decision should be research-backed, even if the research is scrappy. My goal is to blend functionality with aesthetics, ensuring that every interaction feels effortless and meaningful."

Outside work she loves mountain biking, skiing, and hiking. She believes in a balanced, low-tox lifestyle and is always looking for ways to improve health, wellness, and experience more everyday joy.

Contact: jenny.eckles97@gmail.com | jennyeckles.com | (860) 941-4802

--- EXPERIENCE ---
User Experience Designer at Vivint Smart Home (June 2022 – Present)
- Owns end-to-end design strategy for next-generation thermostat experiences across embedded hardware and mobile platforms serving 2 million users.
- Led design of premium presence-aware thermostat experience (Glanceable Thermostat / Codename Pegasus), reducing task time 67% (52s to 17s) and increasing task success from 50% to 98%.
- Owns strategy and redesign of internal thermostat installation tool, decreasing technician error rates and reducing home damage claims cost.
- Partners cross-functionally with engineering, product, field operations, and customer experience teams.

Graphic Designer at Rhone (Nov 2020 – June 2022)
- Supported lifecycle marketing, retail, and brand campaigns.
- Led design of Commuter Pant Fit Guide.
- Redesigned product detail pages to improve above-the-fold clarity with modular icon systems.

--- EDUCATION ---
BS Multi-Disciplinary Design, University of Utah
AAS Fashion Design, Fashion Institute of Technology

--- PROJECTS ---

1. GLANCEABLE THERMOSTAT (Codename: Pegasus) — 2025, Lead Product Designer
Problem: After NRG acquired Vivint, they needed to dramatically scale thermostat adoption for grid-level demand response. Users needed a thermostat that felt reliable, calm, and premium.
Solution: A presence-aware thermostat experience using progressive disclosure based on proximity:
- 10 feet away: Set temperature only, subtle gradient (warm orange = heating, cool blue = cooling)
- 6 feet away: Adds set temp, current indoor temp, outside weather & temperature
- 3 feet away: Full control UI — Settings, Mode, Fan, Humidity
- Tapping set temp enters focused temperature selection; returns to simplified state after 3 seconds of inactivity
Usability Testing: 98% task success rate, 35-second reduction in time on task vs. Nest Gen 4 and Element.
Business Impact: In development. Alpha July 2026, Beta September 2026, Product Launch Q1 2027.

2. THERMOSTAT INSTALLATION — 2025, Lead Product Designer
Problem: Technicians used an outdated app requiring manual PDF interpretation at critical moments. Cost company $250,000 annually in errors and repeat visits.
Solution: Expanded guided flow from 8 to 13 screens with one step per screen, just-in-time instructions, automatic thermostat programming, and AI validation of wiring photos.
Research: Attended technician training program herself, shadowed field installs, ran focus groups.
Business Impact: Projected 60% reduction in errors, $150,000 annual cost savings, increased technician confidence.

--- SKILLS & APPROACH ---
Research-backed design, progressive disclosure, cross-functional collaboration, product roadmaps, data-informed design, smart home systems, operational workflow design.`;

const chatArea = document.getElementById('chat-area');
const userInput = document.getElementById('user-input');
const sendBtn  = document.getElementById('send-btn');
let history = [];

const SUGGESTIONS = [
  "What projects has Jenny worked on?",
  "Tell me about the thermostat",
  "What's her background?",
  "How can I contact her?"
];

function addMessage(text, role, withSuggestions = false) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'bot' ? 'J' : 'Y';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;

  wrap.appendChild(av);
  wrap.appendChild(bub);
  chatArea.appendChild(wrap);

  if (withSuggestions) {
    const suggRow = document.createElement('div');
    suggRow.className = 'suggestions';
    SUGGESTIONS.forEach(s => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = s;
      chip.onclick = () => { userInput.value = s; sendMessage(); };
      suggRow.appendChild(chip);
    });
    chatArea.appendChild(suggRow);
  }

  chatArea.scrollTop = chatArea.scrollHeight;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = 'J';
  av.style.cssText = 'background:linear-gradient(135deg,#e8c4b3,#b84a1e);color:white;';
  const bub = document.createElement('div');
  bub.className = 'typing-bubble';
  for (let i = 0; i < 3; i++) { const d = document.createElement('div'); d.className = 'dot'; bub.appendChild(d); }
  wrap.appendChild(av);
  wrap.appendChild(bub);
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  history.push({ role: 'user', content: text });
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await res.json();
    removeTyping();
    const reply = data.content?.[0]?.text || "Sorry, something went wrong. Reach Jenny at jenny.eckles97@gmail.com.";
    history.push({ role: 'assistant', content: reply });
    addMessage(reply, 'bot');
  } catch(e) {
    removeTyping();
    addMessage("Something went wrong. Please try again.", 'bot');
  }

  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 80) + 'px';
});

setTimeout(() => {
  addMessage("Hi! I can answer questions about Jenny's design work, experience, and background. What would you like to know?", 'bot', true);
}, 250);
</script>
</body>
</html>
